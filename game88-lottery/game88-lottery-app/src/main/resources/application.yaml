server:
  undertow:
    threads:
      io: 16
      worker: 256
    buffer-size: 1024
    direct-buffers: true
  shutdown: graceful
  port: 18814
  max-http-header-size: 65536
spring:
  profiles:
    active: 8800
  application:
    name: game88-lottery-app
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      ## 空闲连接存活最大时间，默认600000（10分钟）
      idle-timeout: 20000
      ## 连接池最大连接数，默认是10
      maximum-pool-size: 5000
      ## 此属性控制从池返回的连接的默认自动提交行为,默认值：true
      auto-commit: true
      ## 连接池名称
      pool-name: HikariPool
      ## 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      max-lifetime: 30000
      ## 数据库连接超时时间,默认30秒，即30000
      connection-timeout: 60000
      connection-test-query: SELECT 1 FROM DUAL
      validation-timeout: 3000
      login-timeout: 5

  ## Redis 配置
  redis:
    jedis:
      pool:
        ## 连接池最大连接数（使用负值表示没有限制）
        ##spring.redis.pool.max-active=8
        max-active: 5000
        ##连接池最大阻塞等待时间（使用负值表示没有限制）
        ##spring.redis.pool.max-wait=-1
        max-wait: 10s
        ## 连接池中的最大空闲连接
        ##spring.redis.pool.max-idle=8
        max-idle: 100
        ## 连接池中的最小空闲连接
        ##spring.redis.pool.min-idle=0
        min-idle: 5
        time-between-eviction-runs: 30s
    ## 连接超时时间（毫秒）
    timeout: 5000
  #配置时间返回格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  mvc:
    async:
      request-timeout: 20000
    pathmatch:
      matching-strategy: ant_path_matcher
  lifecycle:
    timeout-per-shutdown-phase: 5s
  task:
    scheduling:
      pool:
        size: 50

pagehelper:
  autoRuntimeDialect: true

# token配置
token:
  # 令牌有效期（默认1天）
  expireTime: 6

im:
  # 群聊
  sendGroupMsg: http://alb-c8bpqf3la2md9yeih2.cn-hongkong.alb.aliyuncs.com/chat/sendGroupMsg/
  # 单聊
  sendMsg: http://alb-c8bpqf3la2md9yeih2.cn-hongkong.alb.aliyuncs.com/chat/sendMsg/

swagger:
  title: Game88 Lottery App Swagger 3 Api Documentation
  description: Game88 Lottery App Spring Boot Plugin Swagger 3 Web Api Documentation
  version: 1.0.0
springdoc:
  api-docs:
    enabled: false
  packages-to-scan: tv.game88.lottery.app.controller

management:
  endpoint:
    health:
      enabled: true
      show-details: when_authorized
    beans:
      enabled: false
    info:
      enabled: false
    conditions:
      enabled: false
    shutdown:
      enabled: false
    configprops:
      enabled: false
    auditevents:
      enabled: false
    caches:
      enabled: false
    env:
      enabled: false
    metrics:
      enabled: false
    scheduledtasks:
      enabled: false
    mappings:
      enabled: false
    loggers:
      enabled: false
    integrationgraph:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
