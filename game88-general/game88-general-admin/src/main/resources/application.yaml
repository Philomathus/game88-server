server:
  undertow:
    threads:
      io: 16
      worker: 256
    buffer-size: 1024
    direct-buffers: true
  shutdown: graceful
  port: 18852
  max-http-request-header-size: 64KB
spring:
  profiles:
    active: dev
  application:
    name: game88-general-admin
  datasource:
    dynamic:
      hikari:
        ## 最小空闲连接数量
        minimum-idle: 5
        ## 空闲连接存活最大时间，默认600000（10分钟）
        idle-timeout: 30000
        ## 连接池最大连接数，默认是10
        maximum-pool-size: 20
        ## 此属性控制从池返回的连接的默认自动提交行为,默认值：true
        is-auto-commit: true
        ## 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
        max-lifetime: 60000
        ## 数据库连接超时时间,默认30秒，即30000
        connection-timeout: 30000
        connection-test-query: SELECT 1 FROM DUAL
        validation-timeout: 3000
      primary: master #设置默认的数据源或者数据源组,默认值即为master
      strict: true #严格匹配数据源,默认false. true未匹配到指定数据源时抛异常,false使用默认数据源
      datasource:
        master:
          type: com.zaxxer.hikari.HikariDataSource
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            minimum-idle: 10
            ## 空闲连接存活最大时间，默认600000（10分钟）
            idle-timeout: 30000
            ## 连接池最大连接数，默认是10
            maximum-pool-size: 100
            ## 此属性控制从池返回的连接的默认自动提交行为,默认值：true
            is-auto-commit: true
            ## 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
            max-lifetime: 60000
            ## 数据库连接超时时间,默认30秒，即30000
            connection-timeout: 30000
            connection-test-query: SELECT 1 FROM DUAL
            validation-timeout: 3000

  ## Redis 配置
  data:
    redis:
      jedis:
        pool:
          ## 连接池最大连接数（使用负值表示没有限制）
          ##spring.redis.pool.max-active=8
          max-active: 5000
          ##连接池最大阻塞等待时间（使用负值表示没有限制）
          ##spring.redis.pool.max-wait=-1
          max-wait: 10s
          ## 连接池中的最大空闲连接
          ##spring.redis.pool.max-idle=8
          max-idle: 10
          ## 连接池中的最小空闲连接
          ##spring.redis.pool.min-idle=0
          min-idle: 1
          time-between-eviction-runs: 30s
      ## 连接超时时间（毫秒）
      timeout: 5000

  #配置时间返回格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  mvc:
    async:
      request-timeout: 20000
  lifecycle:
    timeout-per-shutdown-phase: 10s
  task:
    scheduling:
      pool:
        size: 50

pagehelper:
  autoRuntimeDialect: true

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥 HS512算法
  secret: F3bjHBhEm41jDTj2RFwM/Diofky+sW1gmNquvwnz3p0UZh6Yq6xxiPO4hTCbpYFVqjpxWDjEtclvXtkLo/zdtw==
  # 令牌有效期（默认1小时）
  expireTime: 6

management:
  endpoint:
    health:
      enabled: true
      show-details: when_authorized
    beans:
      enabled: false
    info:
      enabled: false
    conditions:
      enabled: false
    shutdown:
      enabled: false
    configprops:
      enabled: false
    auditevents:
      enabled: false
    caches:
      enabled: false
    env:
      enabled: false
    metrics:
      enabled: false
    scheduledtasks:
      enabled: false
    mappings:
      enabled: false
    loggers:
      enabled: false
    integrationgraph:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false