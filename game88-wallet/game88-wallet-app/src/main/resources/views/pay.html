        .third {

        }

        .fourth {

        }

            align-items: center;
            justify-content: center;

        @media screen and (max-width: 500px) {

            }

                width: 100%;

            }

            .labelName {

            }

            .fourth {

                flex-shrink: 1;
            }

        @media screen and (max-width: 360px) {

            }

            right: .1rem;

        ;

<script>
    // Initialize an empty object for the request body
    const requestBody = {};

    // Get the current URL and create a URL object
    const currentURL = window.location.href;
    const urlObject = new URL(currentURL);
    // console.log(urlObject)
    // Populate the object with URL parameters
    requestBody.s = (new URLSearchParams(urlObject.search)).get('s');
    requestBody.t = (new URLSearchParams(urlObject.search)).get('t');

    // Target the password input field
    const passwordInput = document.querySelector('.third input[type="password"]');
    let passwordValue = ""; // To store the password

    // Listen for changes in the password input field
    passwordInput.addEventListener('input', function (event) {
        passwordValue = event.target.value;
    });

    // let title = document.getElementById('title')
    // title.innerHTML = urlObject

    function showModal(message) {
        // Create the outer modal div
        const modal = document.createElement('div');
        modal.style.position = 'fixed';
        modal.style.top = '0';
        modal.style.left = '0';
        modal.style.width = '100%';
        modal.style.height = '100%';
        modal.style.backgroundColor = 'rgba(0,0,0,0.5)';
        modal.style.display = 'flex';
        modal.style.justifyContent = 'center';
        modal.style.alignItems = 'center';

        // Create the inner white container div
        const container = document.createElement('div');
        container.style.backgroundColor = 'white';
        container.style.padding = '20px';
        container.style.borderRadius = '10px';
        container.style.color = 'black';

        // Add the message to the container
        container.innerHTML = "<p>" + message + "</p>";

        // Append the container to the modal
        modal.appendChild(container);

        // Append the modal to the body
        document.body.appendChild(modal);

        // Click to close the modal
        modal.addEventListener('click', function () {
            document.body.removeChild(modal);
        });
    }



</script>

<!-- script for the input type toggling -->
<script>
    // Step 1: Initialize UI Elements
    const passwordInput2 = document.querySelector('.third input[type="password"]');
    const toggleShow = document.querySelector('.toggleShow');
    const toggleHide = document.querySelector('.toggleHide');

    // Step 2: Set Initial Visibility
    toggleShow.style.display = 'flex';
    toggleHide.style.display = 'none';

    // Step 3: Add Event Listeners

    // Case: When 'toggleShow' is clicked
    toggleShow.addEventListener('click', function () {
        // Change input type to 'text'
        passwordInput2.type = 'text';

        // Hide 'toggleShow' and show 'toggleHide'
        toggleShow.style.display = 'none';
        toggleHide.style.display = 'flex';
    });

    // Case: When 'toggleHide' is clicked
    toggleHide.addEventListener('click', function () {
        // Change input type back to 'password'
        passwordInput2.type = 'password';

        // Hide 'toggleHide' and show 'toggleShow'
        toggleHide.style.display = 'none';
        toggleShow.style.display = 'flex';
    });

</script>

<script>
    const submitButton = document.getElementById('submitButton');

    submitButton.addEventListener('click', function () {
        // Validate the password

        // Case 1: Check if password is empty
        if (passwordValue.trim() === "") {
            showModal("密码不能为空");
        }
        // Case 2: Check if password is a 6-digit number
        else if (/^\d{6}$/.test(passwordValue)) {

            // Update the password in the request body
            requestBody.p = passwordValue;

            // Initialize a new XMLHttpRequest
            const xhr = new XMLHttpRequest();
            const url = urlObject.protocol + '//' + urlObject.hostname + '/api/common/payDepositOrder';
            xhr.open('POST', url, true);
            xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');

            // Event handler for successful response
            xhr.onload = function () {
                // Case 3: Check if HTTP status is 200
                if (xhr.status === 200) {
                    // Parse the custom API response
                    const customResponse = JSON.parse(xhr.responseText);

                    // Sub-case 1: Custom API response code is 200
                    if (customResponse.code === 200) {
                        showModal(customResponse.msg);
                        if (window.Android) {
                            Android.receiveStatusCode(200);  // Mimic sending a "status code"
                        }
                        window.postMessage({ statusCode: 200 }, '*');
                        document.getElementById("submitButton").style.display = "none"
                        window.close();
                    }
                    // Sub-case 2: Custom API response code is 401
                    else if (customResponse.code === 401) {
                        showModal(customResponse.msg);
                    }
                    // Sub-case 3: Custom API response code is 500
                    else if (customResponse.code === 500) {
                        showModal(customResponse.msg);
                    }
                    // Sub-case 4: Other custom API response codes
                    else {
                        showModal(customResponse.msg || "Unknown error.");
                    }
                }
                // Case 4: Check if HTTP status is 500
                else if (xhr.status === 500) {
                    showModal("A network error occurred.");
                }
                // Case 5: Other HTTP status codes
                else {
                    showModal("Unknown server error.");
                }
            };

            // Event handler for request errors
            xhr.onerror = function () {
                // Handle network errors
                showModal("Network error.");
            };

            // Send the request
            xhr.send(JSON.stringify(requestBody));
        }
        // Case 6: Invalid password format
        else {
            showModal("密码必须为6位数字!");
        }
    });

</script>
