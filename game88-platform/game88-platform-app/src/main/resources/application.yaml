server:
  tomcat:
    max-connections: 80000
    accept-count: 100
    threads:
      max: 800
      min-spare: 80
  shutdown: graceful
  port: 18811
  max-http-request-header-size: 64KB
spring:
  threads:
    virtual:
      enabled: true
  profiles:
    active: 8800
  application:
    name: game88-platform-app
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      ## 空闲连接存活最大时间，默认600000（10分钟）
      idle-timeout: 20000
      ## 连接池最大连接数，默认是10
      maximum-pool-size: 5000
      ## 此属性控制从池返回的连接的默认自动提交行为,默认值：true
      auto-commit: true
      ## 连接池名称
      pool-name: HikariPool
      ## 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      max-lifetime: 30000
      ## 数据库连接超时时间,默认30秒，即30000
      connection-timeout: 60000
      connection-test-query: SELECT 1 FROM DUAL
      validation-timeout: 3000
      login-timeout: 5

  ## Redis 配置
  data:
    redis:
      jedis:
        pool:
          ## 连接池最大连接数（使用负值表示没有限制）
          ##spring.redis.pool.max-active=8
          max-active: 5000
          ##连接池最大阻塞等待时间（使用负值表示没有限制）
          ##spring.redis.pool.max-wait=-1
          max-wait: 10s
          ## 连接池中的最大空闲连接
          ##spring.redis.pool.max-idle=8
          max-idle: 100
          ## 连接池中的最小空闲连接
          ##spring.redis.pool.min-idle=0
          min-idle: 5
          time-between-eviction-runs: 30s
      ## 连接超时时间（毫秒）
      timeout: 5000
  #配置时间返回格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  mvc:
    async:
      request-timeout: 20000
    pathmatch:
      matching-strategy: ant_path_matcher
  lifecycle:
    timeout-per-shutdown-phase: 10s

pagehelper:
  autoRuntimeDialect: true

# token配置
token:
  # 令牌有效期（默认1天）
  expireTime: 180

im:
  tokenUrl: http://47.243.143.163:43000/token/auth

swagger:
  title: Game88 Platform App Swagger 3 Api Documentation
  description: Game88 Platform App Spring Boot Plugin Swagger 3 Web Api Documentation
  version: 1.0.0
springdoc:
  api-docs:
    enabled: false
  packages-to-scan: tv.game88.platform.app.controller

management:
  server:
    port: 8811
  endpoint:
    health:
      enabled: true
      show-details: ALWAYS
      probes:
        enabled: true
    info:
      enabled: true
      cache:
        time-to-live: 10m
    configprops:
      show-values: ALWAYS
    env:
      show-values: ALWAYS
  endpoints:
    web:
      exposure:
        include: "*"
    enabled-by-default: true
  info:
    java:
      enabled: true
    env:
      enabled: true
    os:
      enabled: true
