server:
  undertow:
    threads:
      io: 32
      worker: 256
    buffer-size: 1024
    direct-buffers: true
  shutdown: graceful
  port: 18802
  max-http-request-header-size: 64KB
spring:
  threads:
    virtual:
      enabled: true
  profiles:
    active: 8800
  application:
    name: game88-pay-admin
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      ## 空闲连接存活最大时间，默认600000（10分钟）
      idle-timeout: 20000
      ## 连接池最大连接数，默认是10
      maximum-pool-size: 5000
      ## 此属性控制从池返回的连接的默认自动提交行为,默认值：true
      auto-commit: true
      ## 连接池名称
      pool-name: HikariPool
      ## 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      max-lifetime: 30000
      ## 数据库连接超时时间,默认30秒，即30000
      connection-timeout: 60000
      connection-test-query: SELECT 1 FROM DUAL
      validation-timeout: 3000
      login-timeout: 5

  ## Redis 配置
  data:
    redis:
      lettuce:
        pool:
          ## 连接池最大连接数（使用负值表示没有限制）
          ##spring.redis.pool.max-active=8
          max-active: 5000
          ##连接池最大阻塞等待时间（使用负值表示没有限制）
          ##spring.redis.pool.max-wait=-1
          max-wait: 10s
          ## 连接池中的最大空闲连接
          ##spring.redis.pool.max-idle=8
          max-idle: 100
          ## 连接池中的最小空闲连接
          ##spring.redis.pool.min-idle=0
          min-idle: 5
          time-between-eviction-runs: 30s
      ## 连接超时时间（毫秒）
      timeout: 5000
  #配置时间返回格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  mvc:
    async:
      request-timeout: 20000
  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB
  lifecycle:
    timeout-per-shutdown-phase: 10s

pagehelper:
  autoRuntimeDialect: true

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥 HS512算法
  secret: F3bjHBhEm41jDTj2RFwM/Diofky+sW1gmNquvwnz3p0UZh6Yq6xxiPO4hTCbpYFVqjpxWDjEtclvXtkLo/zdtw==
  # 令牌有效期（默认1小时）
  expireTime: 6

management:
  server:
    port: 8802
  endpoint:
    health:
      enabled: true
      show-details: ALWAYS
      probes:
        enabled: true
    info:
      enabled: true
      cache:
        time-to-live: 10m
    configprops:
      show-values: ALWAYS
    env:
      show-values: ALWAYS
  endpoints:
    web:
      exposure:
        include: "*"
    enabled-by-default: true
  info:
    java:
      enabled: true
    env:
      enabled: true
    os:
      enabled: true
